plugins {
    id 'com.android.application'
}

// a versão vem do app web (app/appinfo.json): 1.5.1 -> versionCode 10501
def info = new groovy.json.JsonSlurper().parse(file('../../app/appinfo.json'))
def parts = info.version.tokenize('.')
def code = parts[0].toInteger() * 10000 + parts[1].toInteger() * 100 + parts[2].toInteger()

android {
    namespace 'com.rodrigo.iptv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rodrigo.iptv'
        minSdk 21
        targetSdk 34
        versionCode code
        versionName info.version
    }

    // Assinatura: no GitHub vem dos segredos (variáveis KS_*). Sem elas, o build usa a chave de depuração.
    // A mesma chave tem de ser usada sempre: é ela que permite atualizar o app por cima.
    signingConfigs {
        release {
            if (System.getenv('KS_FILE')) {
                storeFile file(System.getenv('KS_FILE'))
                storePassword System.getenv('KS_PASSWORD')
                keyAlias System.getenv('KS_ALIAS')
                keyPassword System.getenv('KS_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KS_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
// sem dependências externas: o app é um WebView que carrega os arquivos de assets/www
