<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <title>Master IPTV</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <div id="detail" class="hidden"></div>
  <div id="profiles" class="hidden scroll"></div>

  <div id="player" class="hidden">
    <video id="video" autoplay></video>
    <div id="buffer" class="hidden"><div class="spinner"></div></div>
    <div id="chnum" class="hidden"></div>
    <div id="osd" class="hidden">
      <div class="osd-top"><button id="osd-tracks" type="button">Áudio e legenda</button><span id="osd-clock"></span></div>
      <div class="osd-bottom">
        <div id="osd-logo"></div>
        <div class="osd-info">
          <div class="osd-titlerow"><div id="osd-title"></div><span id="osd-res" class="hidden"></span></div>
          <div id="osd-sub"></div>
          <div id="osd-sub2"></div>
          <div id="osd-bar" class="hidden">
            <span id="osd-cur">0:00</span>
            <div class="track"><div id="osd-fill"></div></div>
            <span id="osd-dur">0:00</span>
          </div>
        </div>
        <div id="osd-hint"></div>
      </div>
    </div>
    <div id="tracks" class="hidden scroll"></div>
  </div>

  <div id="loader" class="hidden"><div class="spinner"></div><div id="loader-text">Carregando…</div></div>
  <div id="toast" class="hidden"></div>

  <script src="lib/hls.min.js"></script>
  <script src="lib/mpegts.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/android.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
