name: Build e publicar

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node tests/test-core.js && node tests/test-ui.js
      - run: npx ares-package app services --no-minify -o dist
      - run: node scripts/make-repo.js ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            dist/repo.json
            dist/description.html
            dist/app-icon-large.png
