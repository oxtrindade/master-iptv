name: Build e publicar

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/test-core.js && node tests/test-ui.js
      - run: npx ares-package app services --no-minify -o dist
      - run: node scripts/make-repo.js ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*
      - name: Versão do app
        id: ver
        run: echo "v=$(node -p "require('./app/appinfo.json').version")" >> "$GITHUB_OUTPUT"
      # a cada envio na main (ou tag v*): publica a Release v<versão do appinfo.json> com .ipk, repo.json, descrição e ícone
      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.v }}
          files: |
            dist/*.ipk
            dist/repo.json
            dist/description.html
            dist/app-icon-large.png

  # APK do Android (celular e Android TV). Roda depois do job acima para não disputar a criação da Release.
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copiar o app web para dentro do APK
        run: node scripts/build-android-assets.js
      - name: Chave de assinatura (segredos do repositório)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KS_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sem segredo ANDROID_KEYSTORE_B64: o APK sai com chave de teste e não atualiza por cima do anterior."
          fi
      - name: Compilar o APK
        env:
          KS_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: master-iptv
        run: gradle -p android assembleRelease --no-daemon
      - name: Nomear o APK
        run: |
          VERSION=$(node -p "require('./app/appinfo.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/master-iptv-$VERSION.apk"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
      - name: Versão do app
        id: ver
        run: echo "v=$(node -p "require('./app/appinfo.json').version")" >> "$GITHUB_OUTPUT"
      - name: Anexar o APK na Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.v }}
          files: dist/*.apk
